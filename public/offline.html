<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;color:#06172f;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:420px;margin:24px;padding:32px;background:#fff;border:1px solid #dbe3ee;border-radius:16px;text-align:center}
  h1{font-size:20px;margin:0 0 8px}
  p{margin:0 0 20px;color:#52627a;line-height:1.5;font-size:14px}
  button{background:#06172f;color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>This page has not been opened on this device yet, so it is not available offline.
     Pages you have already visited, and your saved cars, customers, drivers and bookings, still work.</p>
  <button onclick="location.reload()">Try again</button>
  <p style="margin:16px 0 0"><a href="/dashboard">Go to dashboard</a></p>
</main>
</body>
</html>
